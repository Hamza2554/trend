<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شيبس وبطاطس ترند | TREND</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: #0b0b0b; color: #fff; padding-bottom: 95px; user-select: none; }
  
  .top-bar { background: #141414; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
  .status-badge { font-size: 12px; font-weight: bold; color: #4ade80; }

  .hero { text-align: center; padding: 14px 15px 4px; }
  .main-logo { 
    width: 150px; 
    height: 150px; 
    margin: 0 auto; 
    border-radius: 50%; 
    border: none; 
    outline: none;
    object-fit: cover; 
    display: block; 
  }
  .logo-fallback { width: 145px; height: 145px; margin: 0 auto; display: none; align-items: center; justify-content: center; color: #f5b014; font-weight: 900; font-size: 24px; }
  
  .hero h1 { font-size: 20px; color: #fff; margin-top: 8px; margin-bottom: 4px; }
  .hero .sub { font-size: 13px; color: #f5b014; font-weight: bold; margin-bottom: 6px; }
  .hero p { font-size: 12px; color: #aaa; }

  .live-offer { margin: 10px 15px; background: #261803; border: 1px dashed #f5b014; border-radius: 8px; padding: 10px; font-size: 13px; color: #f5b014; text-align: center; font-weight: bold; display: none; }

  .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; position: sticky; top: 0; background: #0b0b0b; z-index: 90; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
  .category-nav::-webkit-scrollbar { display: none; }
  .cat-btn { background: #181818; color: #ccc; border: 1px solid #2e2e2e; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
  .cat-btn.active { background: #f5b014; color: #000; border-color: #f5b014; }

  .section-title { padding: 14px 15px 6px; font-size: 14px; color: #f5b014; font-weight: bold; }
  .menu-list { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
  
  .item-card { background: #141414; border: 1px solid #242424; border-radius: 12px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
  .item-card.selected { border-color: #f5b014; background: #19160f; }
  
  .item-right { display: flex; align-items: center; gap: 10px; flex: 1; }
  .item-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #202020; border: 1px solid #333; flex-shrink: 0; }
  .item-meta h3 { font-size: 14px; color: #fff; margin-bottom: 3px; }
  .item-desc { font-size: 11px; color: #888; margin-bottom: 4px; line-height: 1.3; }
  .item-price { font-size: 13px; color: #f5b014; font-weight: bold; }

  .add-btn { background: #f5b014; color: #000; border: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .qty-box { display: flex; align-items: center; gap: 4px; background: #202020; border: 1px solid #3a3a3a; border-radius: 8px; padding: 2px; }
  .qty-btn { width: 30px; height: 30px; border-radius: 6px; border: none; background: #2a2a2a; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn:active { background: #f5b014; color: #000; }
  .qty-val { font-size: 13px; font-weight: bold; min-width: 22px; text-align: center; color: #f5b014; }

  .empty-msg { text-align: center; padding: 30px 15px; color: #777; font-size: 13px; }

  .customer-box { margin: 15px; background: #141414; border: 1px solid #242424; border-radius: 12px; padding: 14px; }
  .customer-box h4 { font-size: 13px; color: #f5b014; margin-bottom: 12px; }
  .input-label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .input-field { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; outline: none; }
  .input-field:focus { border-color: #f5b014; }

  .input-error { border: 2px solid #ef4444 !important; background: #2b0b0b !important; }
  .gps-btn { background: #261f0c; color: #f5b014; border: 1px dashed #f5b014; width: 100%; padding: 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }

  .summary-card { margin: 15px; background: #141414; border: 1px solid #242424; border-radius: 12px; padding: 14px; font-size: 13px; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #ccc; }
  .summary-row.total { border-top: 1px solid #333; padding-top: 8px; margin-top: 6px; font-weight: bold; color: #fff; font-size: 15px; }

  .free-delivery-banner { background: #14532d; color: #4ade80; padding: 9px 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 12px; margin-top: 10px; border: 1px solid #22c55e; }

  .action-buttons { display: flex; gap: 6px; margin-top: 12px; }
  .btn-whatsapp { flex: 2; background: #22c55e; color: #000; font-weight: bold; font-size: 13px; border: none; border-radius: 10px; padding: 12px 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-sms { flex: 2; background: #2563eb; color: #fff; font-weight: bold; font-size: 13px; border: none; border-radius: 10px; padding: 12px 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-call { flex: 1.2; background: #f5b014; color: #000; font-weight: bold; font-size: 13px; border: none; border-radius: 10px; padding: 12px 4px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #141414; border-top: 1px solid #252525; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 99; }
  .bottom-total-num { font-size: 16px; color: #f5b014; font-weight: bold; }
  .bottom-actions { display: flex; gap: 6px; }
  .bottom-btn { background: #f5b014; color: #000; font-weight: bold; border: none; padding: 9px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .bottom-call { background: #22c55e; color: #000; font-weight: bold; text-decoration: none; padding: 9px 12px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; }
</style>
</head>
<body>

  <div class="top-bar">
    <span style="font-weight:bold; color:#f5b014;">TREND 🍟</span>
    <span class="status-badge" id="netSourceBadge">● التوصيل متاح الآن</span>
  </div>

  <div class="hero">
    <img src="logo.jpg" alt="TREND" class="main-logo" onerror="this.style.display='none'; document.getElementById('altLogo').style.display='flex';">
    <div id="altLogo" class="logo-fallback">TREND</div>
    <h1>بطاطس وشيبس ترند</h1>
    <div class="sub">أشهى وجبات وبطاطس مقرمشة في الحارة</div>
    <p>توصيل مجاني للطلبات فوق <span id="heroMinFree" style="color:#f5b014; font-weight:bold;">1000</span> ريال</p>
  </div>

  <div id="liveOfferBox" class="live-offer"></div>

  <div class="category-nav" id="categoryNav"></div>
  <div id="menuSections"></div>

  <div class="customer-box" id="customerSection">
    <h4>📍 بيانات طلب التوصيل</h4>
    <label class="input-label">1. الاسم الكريم (اختياري):</label>
    <input type="text" id="custName" class="input-field" placeholder="اكتب اسمك الكريم هنا">

    <label class="input-label" style="color:#f5b014;">2. العنوان بالتفصيل (مطلوب) *:</label>
    <input type="text" id="custAddress" class="input-field" placeholder="الحارة - الشارع - جوار مسجد أو معلم واضح..." oninput="this.classList.remove('input-error')" required>
    
    <button type="button" class="gps-btn" onclick="getLocation()">📍 إرفاق موقعي الحالي عبر GPS</button>

    <label class="input-label">3. رقم الهاتف (اختياري):</label>
    <input type="tel" id="custPhone" class="input-field" placeholder="رقم هاتف للتواصل">

    <label class="input-label">4. ملاحظات خاصة بالوجبة (اختياري):</label>
    <input type="text" id="custNotes" class="input-field" placeholder="مثلاً: شطة زيادة / صوص خارجي / بدون ثوم">
  </div>

  <div class="summary-card">
    <div class="summary-row">
      <span>مجموع الأصناف:</span>
      <span id="subtotalVal">0 ريال</span>
    </div>
    <div class="summary-row">
      <span>رسوم التوصيل:</span>
      <span id="deliveryVal">0 ريال</span>
    </div>
    <div class="summary-row total">
      <span>الإجمالي المطلوب:</span>
      <span id="grandTotalVal" style="color:#f5b014;">0 ريال</span>
    </div>
    
    <div id="freeDeliveryNoticeContainer"></div>

    <div class="action-buttons">
      <button type="button" class="btn-whatsapp" id="mainWaBtn" onclick="sendOrderViaWhatsApp()">
        واتساب 💬
      </button>
      <button type="button" class="btn-sms" id="mainSmsBtn" onclick="sendOrderViaSMS()">
        رسالة SMS ✉️
      </button>
      <a href="tel:780756252" class="btn-call">
        اتصال 📞
      </a>
    </div>
  </div>

  <div class="bottom-bar">
    <div>
      <div style="font-size:10px; color:#aaa;">المطلوب:</div>
      <div class="bottom-total-num" id="bottomTotal">0 ريال</div>
    </div>
    <div class="bottom-actions">
      <a href="tel:780756252" class="bottom-call">📞</a>
      <button type="button" class="bottom-btn" id="bottomOrderBtn" onclick="scrollToOrder()">إتمام الطلب 🛒</button>
    </div>
  </div>

<script>
  var cart = {};
  var freeDeliveryMin = 1000;
  var baseDeliveryFee = 200;
  var SHOP_PHONE = "780756252";
  var SHOP_WHATSAPP = "967780756252";
  var activeCategory = 'all';
  var gpsCoordinates = "";
  var networkName = "طلب مباشر";

  var defaultCategories = [
    { key: "fries", name: "🍟 قسم الشيبس والبطاطس" },
    { key: "burgers", name: "🍔 قسم البرجر" },
    { key: "sandwiches", name: "🧆 سندوتشات وفلافل" }
  ];

  // مصفوفة الأصناف فارغة لإضافتها لاحقاً من لوحة التحكم
  var defaultProducts = [];

  var categories = defaultCategories;
  var allProducts = defaultProducts;

  function detectNetworkSource() {
    var params = new URLSearchParams(window.location.search);
    var net = params.get('net');
    if (net) {
      networkName = decodeURIComponent(net);
      var badge = document.getElementById('netSourceBadge');
      if (badge) badge.textContent = "● شبكة: " + networkName;
    }
  }

  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        gpsCoordinates = "https://maps.google.com/?q=" + lat + "," + lon;
        alert("✅ تم تحديد موقعك بنجاح.");
      }, function() {
        alert("تعذر الوصول للموقع.");
      });
    }
  }

  function changeQty(id, title, price, delta) {
    if (!cart[id]) {
      cart[id] = { id: id, title: title, price: Number(price), count: 0 };
    }
    
    cart[id].count += delta;
    if (cart[id].count < 0) cart[id].count = 0;

    var actionContainer = document.getElementById('action-container-' + id);
    var cardEl = document.getElementById('card-' + id);
    var cleanTitle = title.replace(/'/g, "\\'");

    if (actionContainer) {
      if (cart[id].count > 0) {
        actionContainer.innerHTML = 
          '<div class="qty-box">' +
            '<button type="button" class="qty-btn" onclick="changeQty(' + id + ', \'' + cleanTitle + '\', ' + price + ', -1)">-</button>' +
            '<span class="qty-val">' + cart[id].count + '</span>' +
            '<button type="button" class="qty-btn" onclick="changeQty(' + id + ', \'' + cleanTitle + '\', ' + price + ', 1)">+</button>' +
          '</div>';
        if (cardEl) cardEl.classList.add('selected');
      } else {
        actionContainer.innerHTML = 
          '<button type="button" class="add-btn" onclick="changeQty(' + id + ', \'' + cleanTitle + '\', ' + price + ', 1)">أضف +</button>';
        if (cardEl) cardEl.classList.remove('selected');
      }
    }

    recalculateTotals();
  }

  function recalculateTotals() {
    var subtotal = 0;
    var totalItems = 0;

    for (var key in cart) {
      if (cart[key].count > 0) {
        subtotal += cart[key].price * cart[key].count;
        totalItems += cart[key].count;
      }
    }

    var delivery = 0;
    var noticeBox = document.getElementById('freeDeliveryNoticeContainer');

    if (totalItems > 0) {
      if (subtotal >= freeDeliveryMin) {
        delivery = 0;
        noticeBox.innerHTML = '<div class="free-delivery-banner">🎉 مبروك! حصلت على توصيل مجاني!</div>';
      } else {
        delivery = baseDeliveryFee;
        noticeBox.innerHTML = '';
      }
    } else {
      noticeBox.innerHTML = '';
    }

    var grandTotal = subtotal + delivery;

    document.getElementById('subtotalVal').textContent = subtotal + " ريال";
    var delEl = document.getElementById('deliveryVal');
    delEl.textContent = (delivery === 0 && totalItems > 0) ? "مجاني" : (totalItems === 0 ? "0 ريال" : delivery + " ريال");
    delEl.style.color = (delivery === 0 && totalItems > 0) ? "#4ade80" : "#fff";

    document.getElementById('grandTotalVal').textContent = grandTotal + " ريال";
    document.getElementById('bottomTotal').textContent = grandTotal + " ريال";
  }

  function renderCategoryNav() {
    var nav = document.getElementById('categoryNav');
    nav.innerHTML = '<button class="cat-btn ' + (activeCategory === 'all' ? 'active' : '') + '" onclick="filterCategory(\'all\', this)">الكل 📋</button>';
    categories.forEach(function(c) {
      var btn = document.createElement('button');
      btn.className = 'cat-btn' + (activeCategory === c.key ? ' active' : '');
      btn.textContent = c.name;
      btn.onclick = function() { filterCategory(c.key, btn); };
      nav.appendChild(btn);
    });
  }

  function filterCategory(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderMenu();
  }

  function renderMenu() {
    var container = document.getElementById('menuSections');
    container.innerHTML = '';

    if (!allProducts || allProducts.length === 0) {
      container.innerHTML = '<div class="empty-msg">جاري تجهيز قائمة الوجبات قريباً... 🍟</div>';
      return;
    }

    categories.forEach(function(cat) {
      if (activeCategory !== 'all' && activeCategory !== cat.key) return;

      var items = allProducts.filter(function(p) {
        return p.category === cat.key;
      });
      if (items.length === 0) return;

      var secTitle = document.createElement('div');
      secTitle.className = 'section-title';
      secTitle.textContent = cat.name;
      container.appendChild(secTitle);

      var list = document.createElement('div');
      list.className = 'menu-list';

      items.forEach(function(item) {
        var card = document.createElement('div');
        var isSelected = cart[item.id] && cart[item.id].count > 0;
        card.className = 'item-card' + (isSelected ? ' selected' : '');
        card.id = 'card-' + item.id;
        
        var cleanTitle = (item.title || "وجبة").replace(/'/g, "\\'");
        var currentQty = cart[item.id] ? cart[item.id].count : 0;

        var controlsHtml = '';
        if (currentQty > 0) {
          controlsHtml = 
            '<div class="qty-box">' +
              '<button type="button" class="qty-btn" onclick="changeQty(' + item.id + ', \'' + cleanTitle + '\', ' + (item.price || 0) + ', -1)">-</button>' +
              '<span class="qty-val">' + currentQty + '</span>' +
              '<button type="button" class="qty-btn" onclick="changeQty(' + item.id + ', \'' + cleanTitle + '\', ' + (item.price || 0) + ', 1)">+</button>' +
            '</div>';
        } else {
          controlsHtml = 
            '<button type="button" class="add-btn" onclick="changeQty(' + item.id + ', \'' + cleanTitle + '\', ' + (item.price || 0) + ', 1)">أضف +</button>';
        }

        card.innerHTML = 
          '<div class="item-right">' +
            '<img class="item-thumb" src="' + (item.img || 'logo.jpg') + '" onerror="this.src=\'logo.jpg\'">' +
            '<div class="item-meta">' +
              '<h3>' + (item.title || "وجبة") + '</h3>' +
              '<div class="item-desc">' + (item.desc || "") + '</div>' +
              '<div class="item-price">' + (item.price || 0) + ' ريال</div>' +
            '</div>' +
          '</div>' +
          '<div id="action-container-' + item.id + '">' + controlsHtml + '</div>';

        list.appendChild(card);
      });

      container.appendChild(list);
    });
  }

  function scrollToOrder() {
    var target = document.getElementById('customerSection');
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  }

  function getOrderData() {
    var itemsList = [];
    var subtotal = 0;
    var totalItems = 0;

    for (var key in cart) {
      if (cart[key].count > 0) {
        var itemTotal = cart[key].price * cart[key].count;
        itemsList.push({ count: cart[key].count, title: cart[key].title, total: itemTotal });
        subtotal += itemTotal;
        totalItems += cart[key].count;
      }
    }

    if (totalItems === 0) {
      alert("يرجى اختيار وجبة واحدة على الأقل قبل الإرسال!");
      return null;
    }

    var addrInput = document.getElementById('custAddress');
    var custAddress = addrInput.value.trim();

    if (!custAddress) {
      addrInput.classList.add('input-error');
      scrollToOrder();
      addrInput.focus();
      return null;
    }

    var custName = document.getElementById('custName').value.trim();
    var custPhone = document.getElementById('custPhone').value.trim();
    var custNotes = document.getElementById('custNotes').value.trim();
    var delivery = (subtotal >= freeDeliveryMin) ? 0 : baseDeliveryFee;
    var grandTotal = subtotal + delivery;

    var now = new Date();
    var timeStr = now.toLocaleTimeString('ar-YE', { hour: '2-digit', minute: '2-digit', hour12: true });

    return {
      items: itemsList,
      subtotal: subtotal,
      delivery: delivery,
      grandTotal: grandTotal,
      timeStr: timeStr,
      name: custName,
      address: custAddress,
      phone: custPhone,
      notes: custNotes
    };
  }

  function sendOrderViaWhatsApp() {
    var d = getOrderData();
    if (!d) return;

    var itemsLines = d.items.map(function(i) {
      return "▪️ " + i.count + " × " + i.title + " (" + i.total + " ريال)";
    });

    var msg = "🍟 *طلب توصيل جديد - ترند (TREND)*\n";
    msg += "🕒 *الوقت:* " + d.timeStr + "\n";
    if (d.name) msg += "👤 *الاسم:* " + d.name + "\n";
    msg += "📍 *العنوان:* " + d.address + "\n";
    if (gpsCoordinates) msg += "🗺️ *الموقع:* " + gpsCoordinates + "\n";
    if (d.phone) msg += "📞 *الهاتف:* " + d.phone + "\n";
    if (d.notes) msg += "📝 *ملاحظة:* " + d.notes + "\n";
    msg += "━━━━━━━━━━━━━━\n";
    msg += itemsLines.join("\n") + "\n";
    msg += "━━━━━━━━━━━━━━\n";
    msg += "🧾 *قيمة الأصناف:* " + d.subtotal + " ريال\n";
    msg += "🛵 *التوصيل:* " + (d.delivery === 0 ? "مجاني 🎉" : d.delivery + " ريال") + "\n";
    msg += "💰 *الإجمالي المطلوب:* " + d.grandTotal + " ريال\n";
    msg += "🎁 *المصدر:* " + networkName;

    window.location.href = "whatsapp://send?phone=" + SHOP_WHATSAPP + "&text=" + encodeURIComponent(msg);
  }

  function sendOrderViaSMS() {
    var d = getOrderData();
    if (!d) return;

    var itemsLines = d.items.map(function(i) {
      return "- " + i.count + "x " + i.title + " (" + i.total + "ر)";
    });

    var smsText = "طلب ترند:\n";
    smsText += "الوقت: " + d.timeStr + "\n";
    if (d.name) smsText += "الاسم: " + d.name + "\n";
    smsText += "العنوان: " + d.address + "\n";
    if (d.notes) smsText += "ملاحظة: " + d.notes + "\n";
    smsText += itemsLines.join("\n") + "\n";
    smsText += "الحساب: " + d.grandTotal + " ريال\n";
    smsText += "المصدر: " + networkName;

    window.location.href = "sms:" + SHOP_PHONE + "?body=" + encodeURIComponent(smsText);
  }

  window.onload = function() {
    var savedData = localStorage.getItem('trend_master_data');
    if (savedData) {
      try {
        var d = JSON.parse(savedData);
        if (d.categories && d.categories.length > 0) categories = d.categories;
        if (d.products && d.products.length > 0) allProducts = d.products;
        if (d.free_delivery_min) freeDeliveryMin = Number(d.free_delivery_min);
        if (d.delivery_fee !== undefined) baseDeliveryFee = Number(d.delivery_fee);
      } catch(e) {}
    }
    detectNetworkSource();
    renderCategoryNav();
    renderMenu();
  };
</script>
</body>
</html>
